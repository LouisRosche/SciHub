# Google Cloud Build configuration for SciHub
# This builds and deploys both frontend and backend

steps:
  # Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scihub-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scihub-frontend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: '.'

  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scihub-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scihub-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/scihub-frontend'
    waitFor: ['build-frontend']

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/scihub-backend'
    waitFor: ['build-backend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-backend'
    args:
      - 'run'
      - 'deploy'
      - 'scihub-backend'
      - '--image=gcr.io/$PROJECT_ID/scihub-backend:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--add-cloudsql-instances=$_INSTANCE_CONNECTION_NAME'
      - '--set-secrets=DB_PASSWORD=scihub-db-password:latest,JWT_SECRET=scihub-jwt-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=300'
    waitFor: ['push-backend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-frontend'
    args:
      - 'run'
      - 'deploy'
      - 'scihub-frontend'
      - '--image=gcr.io/$PROJECT_ID/scihub-frontend:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
    waitFor: ['push-frontend']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/scihub-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/scihub-frontend:latest'
  - 'gcr.io/$PROJECT_ID/scihub-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/scihub-backend:latest'

# Substitutions
substitutions:
  _INSTANCE_CONNECTION_NAME: 'project:region:instance' # Change this

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: 1200s
